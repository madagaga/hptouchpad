# go2rtc test configuration for the TouchPad (NOT part of the rootfs image: test tool only, see scripts/rtsp/README.md).
# Each stream starts ffmpeg on demand (first client) and stops it when the last client leaves.
#   front camera /dev/video0 (NV12 640x480) -> hardware H.264 encoder (qcom-vidc, ffmpeg h264_v4l2m2m)
#   internal microphone hw:0,1 (S16_LE stereo 48 kHz, mixer path set by tp at start) -> AAC mono (software)
# The camera and the microphone can only be opened once: use one stream at a time.# URLs: rtsp://<tablet>:8554/cam (video + audio), /video, /mic; web page: http://<tablet>:1984/
api:
  listen: ":1984"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"
  ice_servers: []

log:
  level: info

streams:
  cam: >-
    exec:ffmpeg -hide_banner -v error
    -f v4l2 -input_format nv12 -video_size 640x480 -i /dev/video0
    -f alsa -channels 2 -sample_rate 48000 -i hw:0,1
    -fps_mode passthrough -c:v h264_v4l2m2m -b:v 1M -g 30
    -c:a aac -b:a 64k -ac 1
    -rtsp_transport tcp -f rtsp {output}
  video: >-
    exec:ffmpeg -hide_banner -v error
    -f v4l2 -input_format nv12 -video_size 640x480 -i /dev/video0
    -fps_mode passthrough -c:v h264_v4l2m2m -b:v 1M -g 30
    -rtsp_transport tcp -f rtsp {output}
  mic: >-
    exec:ffmpeg -hide_banner -v error
    -f alsa -channels 2 -sample_rate 48000 -i hw:0,1
    -c:a aac -b:a 64k -ac 1
    -rtsp_transport tcp -f rtsp {output}
