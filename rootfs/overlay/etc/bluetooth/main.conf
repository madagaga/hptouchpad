# bluetoothd (BlueZ) settings of the HP TouchPad: name and class seen by other devices (laptop class, like CyanogenMod), visible for 3 minutes
# when the settings panel turns visibility on. Classic Bluetooth only: the CSR BlueCore 6 has no Low Energy.
[General]
Name = HP TouchPad
Class = 0x00010c
DiscoverableTimeout = 180
PairableTimeout = 180
ControllerMode = bredr
